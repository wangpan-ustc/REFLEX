[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-evolve"
version = "0.2.0"
description = "REFLEX: Reflective Evolution from LLM Experience — train-free evolutionary search for interpretable programmatic policies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "third_party/mles_templates/LICENSE"]
authors = [{ name = "The REFLEX Authors" }]
keywords = [
    "evolutionary search",
    "large language models",
    "multimodal",
    "programmatic policies",
    "interpretable RL",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "openai>=1.30",
    "rank-bm25>=0.2.2",
    "Pillow>=10.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/wangpan-ustc/REFLEX"
Issues = "https://github.com/wangpan-ustc/REFLEX/issues"

[project.optional-dependencies]
control = ["gymnasium>=1.0"]
gym = ["gymnasium[box2d]>=1.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["reflex"]

[tool.setuptools.package-data]
reflex = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
